<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 气象站数据监控系统</title>
  <style>
    :root {
      --bg: #f4f7fd;
      --card: #fff;
      --primary: #1e88e5;
      --text: #22304f;
      --muted: #7a8ca6;
      --border: #e2e8f0;
      --radius: 18px;
      --shadow: 0 18px 50px rgba(34,48,79,0.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); }
    .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { width: min(460px, 100%); background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 32px; }
    .brand { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
    .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 30px; }
    .form-group { display: grid; gap: 10px; margin-bottom: 18px; }
    .form-group label { font-size: 13px; color: var(--muted); }
    .form-group input { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; }
    .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(30,136,229,0.12); }
    .btn { width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 12px; padding: 14px 18px; font-size: 15px; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 16px 36px rgba(30,136,229,0.18); }
    .hint { font-size: 12px; color: var(--muted); margin-top: 18px; text-align: center; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="brand">气象站数据监控系统</div>
      <div class="subtitle">请输入用户名和密码，登录后可查看运行状态与 AI 预报</div>
      <form action="/login" method="post">
        <div class="form-group">
          <label for="username">用户名</label>
          <input id="username" type="text" name="username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input id="password" type="password" name="password" required autocomplete="current-password" />
        </div>
        <button class="btn" type="submit">安全登录</button>
      </form>
      <div class="hint">若系统未启用认证，可直接访问其它页面</div>
    </div>
  </div>
</body>
</html>
