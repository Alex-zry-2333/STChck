<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>站内设备状态</title>
<style>
:root {
  --bg: #f0f6ff;
  --card-bg: #ffffff;
  --primary: #2196f3;
  --primary-dark: #1565c0;
  --primary-light: #e3f2fd;
  --primary-gradient: linear-gradient(135deg, #1565c0, #1e88e5);
  --text-primary: #1a2332;
  --text-secondary: #5a6a7a;
  --text-muted: #9aaaba;
  --border: #e8edf4;
  --shadow: 0 4px 20px rgba(33,150,243,0.08);
  --shadow-hover: 0 8px 30px rgba(33,150,243,0.15);
  --radius: 16px;
  --radius-sm: 12px;
  --green: #4caf50;
  --red: #f44336;
  --orange: #ff9800;
  --gray: #90a4ae;
  --gray-bg: #f5f7fa;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; }

.header {
  background: var(--primary-gradient);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  border-radius: 0 0 var(--radius) var(--radius);
  box-shadow: 0 4px 24px rgba(21,101,192,0.2);
}
.back-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.back-btn:hover { background: rgba(255,255,255,0.25); }
.header-title { color: #fff; }
.header-title h1 { font-size: 18px; font-weight: 600; }
.header-title p { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 2px; }

.container { max-width: 1400px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 320px 1fr; gap: 20px; }

.left-panel {
  background: var(--card-bg);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex; flex-direction: column;
  max-height: calc(100vh - 120px);
}
.panel-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  font-size: 14px; font-weight: 600;
  background: var(--gray-bg);
}
.device-list {
  flex: 1; overflow-y: auto; padding: 10px;
}
.device-card {
  padding: 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  margin-bottom: 10px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--card-bg);
}
.device-card:hover { box-shadow: var(--shadow-hover); border-color: var(--primary); }
.device-card.selected { border-color: var(--primary); background: var(--primary-light); }
.device-card.offline { opacity: 0.7; background: #fafafa; }
.device-card.fallback { background: #f8f9fa; }
.device-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.device-header .indicator { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.device-header .indicator.online { background: var(--green); box-shadow: 0 0 6px rgba(76,175,80,0.4); }
.device-header .indicator.fallback { background: var(--orange); }
.device-header .indicator.offline { background: var(--gray); }
.device-name { font-size: 14px; font-weight: 600; flex: 1; }
.device-type { font-size: 11px; color: var(--text-secondary); background: var(--gray-bg); padding: 2px 8px; border-radius: 10px; }
.device-info { font-size: 11px; color: var(--text-secondary); }
.device-info .time { color: var(--text-muted); }
.device-info .fallback-tag { color: var(--orange); font-weight: 600; }
.device-abnormal { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.device-abnormal .badge { font-size: 10px; padding: 2px 8px; border-radius: 8px; background: rgba(244,67,54,0.08); color: var(--red); border: 1px solid rgba(244,67,54,0.12); }

.right-panel {
  background: var(--card-bg);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  padding: 20px;
  min-height: calc(100vh - 120px);
}
.status-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
.status-header h2 { font-size: 16px; font-weight: 600; }
.status-header .subtitle { font-size: 12px; color: var(--text-secondary); }
.status-header .mode-tag { font-size: 12px; padding: 4px 12px; border-radius: 20px; background: var(--primary-light); color: var(--primary-dark); }

.status-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.status-item {
  background: var(--gray-bg);
  border-radius: var(--radius-sm);
  padding: 12px;
  border-left: 3px solid transparent;
  transition: all 0.2s;
}
.status-item.normal { border-left-color: var(--green); }
.status-item.abnormal { border-left-color: var(--red); background: rgba(244,67,54,0.04); }
.status-item.fallback { opacity: 0.75; }
.status-item .code { font-size: 11px; color: var(--primary); font-family: 'Consolas', monospace; font-weight: 600; margin-bottom: 4px; }
.status-item .name { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.status-item .value { font-size: 15px; font-weight: 600; color: var(--text-primary); word-break: break-all; }
.status-item .alarm { font-size: 11px; color: var(--red); margin-top: 4px; }

.section { margin-bottom: 24px; }
.section-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.section-title::before { content: ''; display: inline-block; width: 4px; height: 12px; background: var(--primary); border-radius: 2px; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

.progress-bar { height: 3px; background: #e8edf4; border-radius: 2px; overflow: hidden; margin-top: 12px; }
.progress-bar-fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width 0.3s; }

@media (max-width: 900px) {
  .container { grid-template-columns: 1fr; }
  .left-panel { max-height: none; }
}
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="header-title">
    <h1 id="pageTitle">站内设备状态</h1>
    <p id="pageSubtitle">--</p>
  </div>
</div>

<div class="container">
  <div class="left-panel">
    <div class="panel-header">设备列表</div>
    <div class="device-list" id="deviceList">
      <div class="empty-state"><p>加载中...</p></div>
    </div>
  </div>

  <div class="right-panel">
    <div class="status-header">
      <div>
        <h2 id="detailTitle">设备状态详情</h2>
        <div class="subtitle" id="detailSubtitle">未选择设备，自动轮播展示共有状态</div>
      </div>
      <div class="mode-tag" id="modeTag">轮播模式</div>
    </div>
    <div id="detailContent">
      <div class="empty-state"><p>正在加载设备状态...</p></div>
    </div>
    <div class="progress-bar"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
  </div>
</div>

<script>
// 路径形如 /station/50936/devices，取 station 后的段作为站号
const __pathParts = location.pathname.split('/').filter(Boolean);
const STATION_ID = __pathParts[0] === 'station' ? (__pathParts[1] || '') : __pathParts.pop();
let allDevices = [];
let selectedIndex = -1;
let carouselTimer = null;
let carouselProgressTimer = null;
const CAROUSEL_INTERVAL = 5000;

function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#039;').replace(/"/g,'&quot;');
}

function formatTime(t) {
  if (!t) return '--';
  return String(t).replace('T', ' ').substring(0, 19);
}

async function loadData() {
  try {
    const resp = await fetch('/api/station/' + encodeURIComponent(STATION_ID) + '/devices');
    const data = await resp.json();
    document.getElementById('pageTitle').textContent = (data.station_name || data.station_id) + ' 设备状态';
    document.getElementById('pageSubtitle').textContent = '站号 ' + data.station_id;
    allDevices = data.devices || [];
    renderDeviceList();
    startCarousel();
    startDevicesSSE();
    if (allDevices.length === 0) {
      document.getElementById('detailContent').innerHTML = '<div class="empty-state"><p>当前分钟暂无设备上报数据，请稍后刷新</p></div>';
    }
  } catch (e) {
    console.error('Load devices error:', e);
    document.getElementById('deviceList').innerHTML = '<div class="empty-state"><p>加载失败</p></div>';
  }
}

function startDevicesSSE() {
  if (!window.EventSource) return;
  const es = new EventSource('/api/devices/events');
  es.onmessage = function(e) {
    try {
      if (!e.data || e.data === 'keep-alive' || e.data === '{}') return;
      const data = JSON.parse(e.data);
      if (!data || data.station_id !== STATION_ID) return;
      allDevices = data.devices || [];
      // Preserve selection if possible
      const selectedId = selectedIndex >= 0 && selectedIndex < allDevices.length
        ? allDevices[selectedIndex].device_type + '|' + allDevices[selectedIndex].device_nid
        : null;
      renderDeviceList();
      if (selectedId) {
        const newIdx = allDevices.findIndex(d => d.device_type + '|' + d.device_nid === selectedId);
        if (newIdx >= 0) {
          selectedIndex = newIdx;
          renderDeviceList();
          renderDetail(allDevices[newIdx]);
        }
      }
    } catch (err) {
      console.error('SSE devices parse error:', err);
    }
  };
  es.onerror = function() {
    es.close();
  };
}

function getStatusClass(device, item) {
  if (item.abnormal) return 'abnormal';
  return 'normal';
}

function renderDeviceList() {
  const el = document.getElementById('deviceList');
  if (allDevices.length === 0) {
    el.innerHTML = '<div class="empty-state"><p>暂无设备状态数据</p></div>';
    return;
  }
  el.innerHTML = allDevices.map((d, idx) => {
    const statusClass = d.is_online ? 'online' : (d.is_fallback ? 'fallback' : 'offline');
    const statusText = d.is_online ? '在线' : (d.is_fallback ? '上分钟值' : '离线');
    const abnormalCount = d.common_status.filter(i => i.abnormal).length + d.specific_status.filter(i => i.abnormal).length;
    const selectedClass = idx === selectedIndex ? 'selected' : '';
    return '<div class="device-card ' + statusClass + ' ' + selectedClass + '" onclick="selectDevice(' + idx + ')">' +
      '<div class="device-header">' +
        '<span class="indicator ' + statusClass + '"></span>' +
        '<span class="device-name">' + escHtml(d.device_name || d.device_type) + '</span>' +
        '<span class="device-type">' + escHtml(d.device_type) + '</span>' +
      '</div>' +
      '<div class="device-info">' +
        '<span>编号 ' + escHtml(d.device_nid) + '</span> · ' +
        '<span class="' + (d.is_fallback ? 'fallback-tag' : 'time') + '">' + statusText + '</span> · ' +
        '<span class="time">' + formatTime(d.last_data_time) + '</span>' +
      '</div>' +
      (abnormalCount > 0 ? '<div class="device-abnormal"><span class="badge">异常 ' + abnormalCount + ' 项</span></div>' : '') +
    '</div>';
  }).join('');
}

function renderDetail(device) {
  const titleEl = document.getElementById('detailTitle');
  const subtitleEl = document.getElementById('detailSubtitle');
  const modeTag = document.getElementById('modeTag');
  const content = document.getElementById('detailContent');

  if (!device) {
    titleEl.textContent = '设备状态详情';
    subtitleEl.textContent = '未选择设备';
    modeTag.textContent = '';
    content.innerHTML = '<div class="empty-state"><p>暂无数据</p></div>';
    return;
  }

  const statusText = device.is_online ? '在线' : (device.is_fallback ? '稍旧数据' : '离线');
  titleEl.textContent = (device.device_name || device.device_type) + ' ' + device.device_nid;
  subtitleEl.textContent = device.is_online ? '最近 1 分钟内数据' : (device.is_fallback ? '最近 6 分钟内最新一条' : '设备离线');
  modeTag.textContent = selectedIndex === -1 ? '轮播模式' : '手动选择';

  let html = '';
  const fallbackClass = device.is_fallback ? 'fallback' : '';

  if (device.common_status && device.common_status.length > 0) {
    html += '<div class="section"><div class="section-title">共有状态</div><div class="status-grid">' +
      device.common_status.map(item =>
        '<div class="status-item ' + getStatusClass(device, item) + ' ' + fallbackClass + '">' +
          '<div class="code">' + escHtml(item.code) + '</div>' +
          '<div class="name">' + escHtml(item.name) + '</div>' +
          '<div class="value">' + escHtml(item.value) + '</div>' +
          (item.abnormal ? '<div class="alarm">' + escHtml(item.alarm_text) + '</div>' : '') +
        '</div>'
      ).join('') +
    '</div></div>';
  }

  if (device.specific_status && device.specific_status.length > 0) {
    html += '<div class="section"><div class="section-title">特有状态</div><div class="status-grid">' +
      device.specific_status.map(item =>
        '<div class="status-item ' + getStatusClass(device, item) + ' ' + fallbackClass + '">' +
          '<div class="code">' + escHtml(item.code) + '</div>' +
          '<div class="name">' + escHtml(item.name) + '</div>' +
          '<div class="value">' + escHtml(item.value) + '</div>' +
          (item.abnormal ? '<div class="alarm">' + escHtml(item.alarm_text) + '</div>' : '') +
        '</div>'
      ).join('') +
    '</div></div>';
  }

  if (!html) {
    html = '<div class="empty-state"><p>该设备无解析后的状态项</p></div>';
  }

  content.innerHTML = html;
}

function selectDevice(index) {
  selectedIndex = index;
  renderDeviceList();
  stopCarousel();
  renderDetail(allDevices[index]);
}

function startCarousel() {
  stopCarousel();
  if (allDevices.length === 0) return;
  selectedIndex = -1;
  renderDeviceList();
  let idx = 0;
  renderDetail(allDevices[idx]);
  updateProgress(0);

  carouselTimer = setInterval(() => {
    idx = (idx + 1) % allDevices.length;
    renderDetail(allDevices[idx]);
    updateProgress(0);
  }, CAROUSEL_INTERVAL);

  let progress = 0;
  carouselProgressTimer = setInterval(() => {
    progress += 100 / (CAROUSEL_INTERVAL / 100);
    if (progress > 100) progress = 100;
    updateProgress(progress);
  }, 100);
}

function stopCarousel() {
  if (carouselTimer) { clearInterval(carouselTimer); carouselTimer = null; }
  if (carouselProgressTimer) { clearInterval(carouselProgressTimer); carouselProgressTimer = null; }
  updateProgress(0);
}

function updateProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
}

loadData();
</script>
</body>
</html>
