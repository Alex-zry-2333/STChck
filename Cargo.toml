[package]
name = "weather-monitor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "weather-monitor"
path = "src/main.rs"

[[bin]]
name = "license-gen"
path = "tools/license-gen.rs"

[features]
default = []
license-check = ["hmac", "sha2", "hex", "dep:clap"]

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors", "limit"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "sqlite", "chrono"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gethostname = "0.4"

# License check dependencies (only compiled when feature enabled)
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
